name: QC Dashboard Screenshot → Slack

# Why */10 instead of hourly: GitHub drops scheduled runs during peak load,
# especially the ":00" slot (their own docs call this out). Scheduling 6x/hour
# and gating on "last successful post < 55m ago" gets us an actual hourly
# cadence even when GH silently skips most attempts.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # for `gh run list` in the gate job

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether to post
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          RUN_ID:   ${{ github.run_id }}
          EVENT:    ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual dispatches always run (user asked for it on purpose).
          if [ "$EVENT" != "schedule" ]; then
            echo "Event is $EVENT — proceed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Find the latest completed-successfully run of THIS workflow,
          # excluding this run itself.
          LAST=$(gh run list -R "$REPO" -w slack-screenshot.yml -L 50 \
                   --json databaseId,status,conclusion,updatedAt \
                   --jq "[.[] | select(.status==\"completed\" and .conclusion==\"success\" and (.databaseId|tostring) != \"$RUN_ID\")] | .[0].updatedAt // empty")
          if [ -z "$LAST" ]; then
            echo "No prior successful run — proceed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW_S=$(date -u +%s)
          LAST_S=$(date -u -d "$LAST" +%s)
          AGE=$((NOW_S - LAST_S))
          echo "Last successful run: $LAST (${AGE}s ago)"
          # 55 min guard = tolerate up to 5 min of GH scheduler jitter per hour
          # while never posting twice in the same hour.
          if [ "$AGE" -lt 3300 ]; then
            echo "Last post < 55m ago — skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last post >= 55m ago — proceed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  screenshot:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1

      - name: Install & setup
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Take screenshots & post to Slack
        timeout-minutes: 12
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK:   ${{ secrets.SLACK_WEBHOOK }}
        run: node screenshot-bot.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: |
            qc-images.png
            qc-videos.png
            qc-360.png
            qc-combined.png
          retention-days: 3
