name: QC Dashboard Screenshot → Slack

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        id: puppeteer-cache
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}

      - name: Install npm deps
        run: npm install

      - name: Download Chromium (if not cached)
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome

      - name: Take screenshot & post to Slack
        timeout-minutes: 8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK:   ${{ secrets.SLACK_WEBHOOK }}
        run: node screenshot-bot.js

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: dashboard.png
          retention-days: 3
