name: QC Dashboard Screenshot → Slack

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Puppeteer
        run: |
          npm install puppeteer
          # Download Chromium separately so we know exact path
          npx puppeteer browsers install chrome

      - name: Take screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          (async () => {
            console.log('Launching...');
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-gpu','--no-zygote']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1600, height: 900 });
            console.log('Navigating...');
            await page.goto('https://vin-tracker-delivery.vercel.app/', { waitUntil: 'networkidle2', timeout: 60000 });
            console.log('Waiting for data...');
            try { await page.waitForSelector('#dash', { timeout: 30000 }); } catch(e) { console.log('Selector timeout'); }
            await new Promise(r => setTimeout(r, 5000));
            await page.evaluate(() => document.documentElement.setAttribute('data-theme','dark'));
            await new Promise(r => setTimeout(r, 500));
            await page.screenshot({ path: 'dashboard.png', clip: { x:0, y:0, width:1600, height:900 } });
            await browser.close();
            console.log('Screenshot saved:', fs.statSync('dashboard.png').size, 'bytes');
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK:   ${{ secrets.SLACK_WEBHOOK }}
        run: |
          node -e "
          const fs    = require('fs');
          const https = require('https');

          const token   = process.env.SLACK_BOT_TOKEN;
          const channel = process.env.SLACK_CHANNEL;
          const webhook = process.env.SLACK_WEBHOOK;
          const now     = new Date().toLocaleString('en-IN', { timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'short' });
          const url     = 'https://vin-tracker-delivery.vercel.app/';

          async function uploadImage() {
            const img      = fs.readFileSync('dashboard.png');
            const boundary = 'B' + Date.now();
            const body = Buffer.concat([
              Buffer.from(
                '--' + boundary + '\r\nContent-Disposition: form-data; name=\"channels\"\r\n\r\n' + channel + '\r\n' +
                '--' + boundary + '\r\nContent-Disposition: form-data; name=\"initial_comment\"\r\n\r\n' +
                '📊 *QC Pendency Dashboard*  ·  ' + now + ' IST\n<' + url + '|🔗 Open Live Dashboard>\r\n' +
                '--' + boundary + '\r\nContent-Disposition: form-data; name=\"file\"; filename=\"dashboard.png\"\r\nContent-Type: image/png\r\n\r\n'
              ),
              img,
              Buffer.from('\r\n--' + boundary + '--\r\n')
            ]);
            return new Promise((res, rej) => {
              const req = https.request({ hostname:'slack.com', path:'/api/files.upload', method:'POST',
                headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'multipart/form-data; boundary='+boundary, 'Content-Length':body.length }
              }, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ const j=JSON.parse(d); console.log(j.ok?'✅ Image sent!':'❌ '+j.error); j.ok?res():rej(j.error); }); });
              req.on('error', rej); req.write(body); req.end();
            });
          }

          async function sendWebhook() {
            const p = JSON.stringify({ text: '📊 *QC Pendency Dashboard*  ·  ' + now + ' IST\n<' + url + '|🔗 Open Dashboard>' });
            return new Promise((res,rej) => {
              const u = new URL(webhook);
              const req = https.request({ hostname:u.hostname, path:u.pathname+u.search, method:'POST',
                headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(p)}
              }, r => { let b=''; r.on('data',d=>b+=d); r.on('end',()=>{ console.log('Webhook:', r.statusCode); res(); }); });
              req.on('error',rej); req.write(p); req.end();
            });
          }

          (async()=>{
            if (token && channel) { try { await uploadImage(); return; } catch(e) { console.error('Upload failed:', e); } }
            await sendWebhook();
          })().catch(e=>{ console.error(e); process.exit(1); });
          "

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: dashboard.png
          retention-days: 3
