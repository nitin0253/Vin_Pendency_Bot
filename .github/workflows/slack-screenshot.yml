name: QC Dashboard Screenshot → Slack

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1

      - name: Install & setup
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Take screenshots & post to Slack
        timeout-minutes: 12
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK:   ${{ secrets.SLACK_WEBHOOK }}
        run: node screenshot-bot.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: |
            qc-images.png
            qc-videos.png
            qc-360.png
            qc-combined.png
          retention-days: 3
